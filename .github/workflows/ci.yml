name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make libtbb-dev libboost-program-options-dev liblz4-dev python3
      - name: Build with warnings
        run: |
          make clean
          make WARN=1 -j$(nproc)
      - name: Dead code scan (dry-run)
        run: |
          python3 tools/deadcode/prune_dead_code.py --verbose || true

